<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Obada Gaming Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* إعدادات الموقع الأساسية */
        :root {
            --primary: #d4af37; /* لون ذهبي ملكي */
            --bg-dark: #0a0a0a;
            --bg-panel: #111111;
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--bg-dark); color: #fff; 
            font-family: 'Orbitron', sans-serif; overflow-x: hidden;
            touch-action: none; /* لمنع تقريب الشاشة بالخطأ */
        }

        /* --- شريط التنقل (Navbar) --- */
        header {
            background: rgba(10, 10, 10, 0.95); border-bottom: 2px solid var(--primary);
            padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;
            position: fixed; width: 100%; top: 0; z-index: 100; box-sizing: border-box;
        }
        .logo { font-family: 'Cinzel', serif; font-size: 1.8rem; color: var(--primary); font-weight: bold; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: #fff; text-decoration: none; font-size: 1rem; transition: 0.3s; }
        .nav-links a:hover { color: var(--primary); }

        /* --- محتوى الموقع الرئيسي --- */
        #websiteContent {
            padding-top: 100px; display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }
        
        .hero-section {
            text-align: center; margin-bottom: 40px;
        }
        .hero-section h1 { font-family: 'Cinzel', serif; font-size: 3rem; color: var(--primary); margin: 0; }
        .hero-section p { color: #aaa; font-size: 1.2rem; }

        .games-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px; width: 85%; max-width: 1200px; padding-bottom: 50px;
        }

        .game-card {
            background: var(--bg-panel); border: 1px solid var(--primary);
            border-radius: 10px; overflow: hidden; text-align: center;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.1); transition: 0.3s;
        }
        .game-card:hover { transform: translateY(-10px); box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3); }
        .game-card-img {
            background: #222; height: 150px; display: flex; justify-content: center; align-items: center;
            border-bottom: 1px solid #333; font-size: 3rem;
        }
        .game-card-info { padding: 20px; }
        .game-card-info h3 { margin: 0 0 10px 0; color: var(--primary); font-family: 'Cinzel', serif; }
        .game-card-info p { margin: 0 0 20px 0; color: #ccc; font-size: 0.9rem; }
        
        select.level-select {
            width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px;
            background: #222; color: #fff; border: 1px solid var(--primary); font-family: 'Orbitron', sans-serif;
        }
        button.play-btn {
            background: var(--primary); color: #000; width: 100%; padding: 12px;
            border: none; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s;
            font-family: 'Orbitron', sans-serif; font-size: 1.1rem;
        }
        button.play-btn:hover { background: #f1c40f; }

        /* --- حاوية اللعبة (تغطي الشاشة عند اللعب) --- */
        #gameOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #e0e0e0; /* خلفية نهارية مضيئة كما طلبنا سابقاً */
            display: none; z-index: 200;
        }
        
        .game-header {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center; z-index: 210;
        }
        
        #exitGameBtn {
            background: rgba(0,0,0,0.8); color: var(--primary); border: 1px solid var(--primary);
            padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold;
            font-family: 'Orbitron', sans-serif;
        }
        #exitGameBtn:hover { background: var(--primary); color: #000; }
        
        #timerDisplay {
            background: rgba(255, 255, 255, 0.8); color: #000; padding: 5px 15px;
            border-radius: 5px; font-weight: bold; border: 2px solid #000; font-size: 1.2rem;
        }

        /* --- أزرار الموبايل داخل اللعبة --- */
        #mobileControls {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: grid; grid-template-columns: 70px 70px 70px; grid-template-rows: 70px 70px; gap: 10px; z-index: 210;
        }
        .ctrl-btn {
            background: rgba(0,0,0,0.6); border: 3px solid var(--primary); border-radius: 50%;
            color: var(--primary); font-size: 2rem; display: flex; justify-content: center; align-items: center; user-select: none;
        }
        .ctrl-btn:active { background: rgba(212, 175, 55, 0.8); color: #000; }
        #btnUp { grid-column: 2; grid-row: 1; }
        #btnLeft { grid-column: 1; grid-row: 2; }
        #btnDown { grid-column: 2; grid-row: 2; }
        #btnRight { grid-column: 3; grid-row: 2; }

        @media (min-width: 769px) { #mobileControls { display: none; } }

        /* شاشة الفوز داخل اللعبة */
        #victoryScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 220; text-align: center;
        }
        #victoryScreen h2 { color: var(--primary); font-size: 3rem; margin-bottom: 10px; text-shadow: 0 0 20px var(--primary); }
        #victoryScreen p { color: #fff; font-size: 1.5rem; margin-bottom: 30px; }
        .vic-btns { display: flex; gap: 15px; }
        .vic-btn { padding: 15px 30px; font-size: 1.1rem; cursor: pointer; border: none; border-radius: 5px; font-family: 'Orbitron', sans-serif; font-weight: bold;}
        .btn-next { background: var(--primary); color: #000; }
        .btn-menu { background: #333; color: #fff; }
    </style>
</head>
<body>

    <!-- شريط التنقل للموقع -->
    <header>
        <div class="logo">Obada Gaming</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Games</a>
            <a href="#">About</a>
        </div>
    </header>

    <!-- محتوى الموقع -->
    <div id="websiteContent">
        <div class="hero-section">
            <h1>Welcome to the Royal Portal</h1>
            <p>Development by Obada</p>
        </div>

        <div class="games-grid">
            <!-- بطاقة اللعبة -->
            <div class="game-card">
                <div class="game-card-img">🌪️</div>
                <div class="game-card-info">
                    <h3>Tornado Maze</h3>
                    <p>A fast-paced 3D escape adventure.</p>
                    <select id="stageSelect" class="level-select">
                        <!-- المراحل الـ 50 -->
                    </select>
                    <button class="play-btn" onclick="openGame()">PLAY NOW</button>
                </div>
            </div>

            <!-- بطاقة وهمية للعبة أخرى (لإعطاء شكل الموقع) -->
            <div class="game-card" style="opacity: 0.6;">
                <div class="game-card-img">⚔️</div>
                <div class="game-card-info">
                    <h3>Shadow Fighter</h3>
                    <p>Coming Soon to the portal.</p>
                    <select class="level-select" disabled><option>Locked</option></select>
                    <button class="play-btn" style="background: #555; cursor: not-allowed;" disabled>LOCKED</button>
                </div>
            </div>
        </div>
    </div>

    <!-- واجهة اللعبة (تغطي الشاشة عند البدء) -->
    <div id="gameOverlay">
        <div class="game-header">
            <button id="exitGameBtn" onclick="closeGame()">&#8592; Exit to Website</button>
            <div id="timerDisplay">0s</div>
        </div>
        
        <div id="mobileControls">
            <div id="btnUp" class="ctrl-btn">▲</div>
            <div id="btnLeft" class="ctrl-btn">◀</div>
            <div id="btnDown" class="ctrl-btn">▼</div>
            <div id="btnRight" class="ctrl-btn">▶</div>
        </div>

        <div id="victoryScreen">
            <h2>VICTORY!</h2>
            <p id="victoryTime">Time: 0s</p>
            <div class="vic-btns">
                <button class="vic-btn btn-next" onclick="nextStage()">Next Stage</button>
                <button class="vic-btn btn-menu" onclick="closeGame()">Website Menu</button>
            </div>
        </div>
    </div>

    <!-- مكتبة اللعبة ثلاثية الأبعاد -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- تهيئة قائمة المراحل في الموقع ---
        window.onload = () => {
            const select = document.getElementById('stageSelect');
            for(let i = 1; i <= 50; i++) {
                let opt = document.createElement('option');
                opt.value = i;
                opt.innerHTML = `Stage ${i} - ${i <= 10 ? 'Easy' : i <= 30 ? 'Medium' : 'Hard'}`;
                select.appendChild(opt);
            }
        };

        // --- إدارة الموقع وفتح اللعبة ---
        const gameOverlay = document.getElementById('gameOverlay');
        let currentStage = 1;

        function openGame() {
            currentStage = parseInt(document.getElementById('stageSelect').value);
            gameOverlay.style.display = 'block';
            document.body.style.overflow = 'hidden'; // منع تمرير الموقع أثناء اللعب
            initGame();
        }

        function closeGame() {
            gameActive = false;
            cancelAnimationFrame(animationId);
            clearInterval(timerInterval);
            gameOverlay.style.display = 'none';
            document.getElementById('victoryScreen').style.display = 'none';
            document.body.style.overflow = 'auto'; // استعادة تمرير الموقع
            if (renderer) renderer.domElement.remove(); // تنظيف مساحة العمل
        }

        function nextStage() {
            document.getElementById('victoryScreen').style.display = 'none';
            if(currentStage < 50) {
                currentStage++;
                document.getElementById('stageSelect').value = currentStage;
                renderer.domElement.remove();
                initGame();
            } else {
                alert("You completed all 50 stages! You are a master!");
                closeGame();
            }
        }

        // --- متغيرات اللعبة ثلاثية الأبعاد (نفس النسخة المحسنة تماماً) ---
        let scene, camera, renderer, player, mazeGroup, goalMarker;
        let gameActive = false, animationId, timerInterval;
        let startTime;
        
        const cellSize = 4;
        const playerSpeed = 0.25; 
        const playerRadius = 0.8;
        let keys = { up: false, down: false, left: false, right: false };
        let mazeGrid = []; 

        function initGame() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f0f0); // إضاءة نهارية

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            // إدراج الكانفاس (شاشة اللعبة) كأول عنصر داخل الـ overlay ليكون بالخلف
            renderer.domElement.style.position = 'absolute';
            renderer.domElement.style.top = '0';
            renderer.domElement.style.left = '0';
            renderer.domElement.style.zIndex = '205';
            gameOverlay.insertBefore(renderer.domElement, gameOverlay.firstChild);

            // الإضاءة الساطعة
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // اللاعب المضيء
            const playerGeo = new THREE.SphereGeometry(playerRadius, 32, 32);
            const playerMat = new THREE.MeshBasicMaterial({ color: 0x00aaff }); 
            player = new THREE.Mesh(playerGeo, playerMat);
            player.position.set(cellSize * 1.5, playerRadius, cellSize * 1.5);
            scene.add(player);

            generateMazeForStage(currentStage);
            setupControls();

            // المؤقت
            startTime = Date.now();
            document.getElementById('timerDisplay').innerText = `0s`;
            timerInterval = setInterval(() => {
                let s = Math.floor((Date.now() - startTime) / 1000);
                document.getElementById('timerDisplay').innerText = `${s}s`;
            }, 1000);

            gameActive = true;
            animate();
        }

        // بناء المتاهة
        function generateMazeForStage(stage) {
            mazeGroup = new THREE.Group();
            let rows = 9 + (Math.floor(stage / 2) * 2); 
            let cols = rows;

            mazeGrid = Array(rows).fill().map(() => Array(cols).fill(1)); 

            function carve(r, c) {
                mazeGrid[r][c] = 0; 
                const dirs = [[-2,0],[2,0],[0,-2],[0,2]].sort(() => Math.random() - 0.5);
                for(let [dr, dc] of dirs) {
                    let nr = r + dr, nc = c + dc;
                    if(nr > 0 && nr < rows-1 && nc > 0 && nc < cols-1 && mazeGrid[nr][nc] === 1) {
                        mazeGrid[r + dr/2][c + dc/2] = 0;
                        carve(nr, nc);
                    }
                }
            }
            carve(1, 1); 
            mazeGrid[rows-2][cols-2] = 0; // النهاية

            const wallGeo = new THREE.BoxGeometry(cellSize, cellSize, cellSize); 
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x555555 }); 
            const floorGeo = new THREE.PlaneGeometry(cellSize, cellSize);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0xcccccc }); 
            const goalMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 }); 

            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    let x = j * cellSize + (cellSize/2);
                    let z = i * cellSize + (cellSize/2);

                    let floor = new THREE.Mesh(floorGeo, floorMat);
                    floor.rotation.x = -Math.PI / 2;
                    floor.position.set(x, 0, z);
                    mazeGroup.add(floor);

                    if (mazeGrid[i][j] === 1) {
                        let wall = new THREE.Mesh(wallGeo, wallMat);
                        wall.position.set(x, cellSize/2, z);
                        mazeGroup.add(wall);
                    }
                }
            }
            
            // خط النهاية
            let goalX = (cols-2) * cellSize + (cellSize/2);
            let goalZ = (rows-2) * cellSize + (cellSize/2);
            goalMarker = new THREE.Mesh(floorGeo, goalMat);
            goalMarker.rotation.x = -Math.PI / 2;
            goalMarker.position.set(goalX, 0.01, goalZ);
            mazeGroup.add(goalMarker);

            scene.add(mazeGroup);
        }

        // أزرار التحكم
        function setupControls() {
            keys = { up: false, down: false, left: false, right: false };
            
            window.onkeydown = (e) => {
                if(e.key === 'ArrowUp' || e.key === 'w') keys.up = true;
                if(e.key === 'ArrowDown' || e.key === 's') keys.down = true;
                if(e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
                if(e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            };
            window.onkeyup = (e) => {
                if(e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
                if(e.key === 'ArrowDown' || e.key === 's') keys.down = false;
                if(e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
                if(e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            };

            const addPointer = (id, key) => {
                const btn = document.getElementById(id);
                btn.onpointerdown = (e) => { e.preventDefault(); keys[key] = true; };
                btn.onpointerup = (e) => { e.preventDefault(); keys[key] = false; };
                btn.onpointercancel = (e) => { e.preventDefault(); keys[key] = false; };
            };
            addPointer('btnUp', 'up'); addPointer('btnDown', 'down');
            addPointer('btnLeft', 'left'); addPointer('btnRight', 'right');
        }

        // التصادم (الانزلاق المرن)
        function getWallAt(x, z) {
            let col = Math.floor(x / cellSize);
            let row = Math.floor(z / cellSize);
            if(row >= 0 && row < mazeGrid.length && col >= 0 && col < mazeGrid[0].length) {
                return mazeGrid[row][col] === 1;
            }
            return true;
        }

        function checkCollision(newX, newZ) {
            let m = playerRadius * 0.8; 
            if(getWallAt(newX + m, newZ + m)) return true;
            if(getWallAt(newX - m, newZ + m)) return true;
            if(getWallAt(newX + m, newZ - m)) return true;
            if(getWallAt(newX - m, newZ - m)) return true;
            return false;
        }

        // دورة التحديث
        function animate() {
            if (!gameActive) return;
            animationId = requestAnimationFrame(animate);

            let dx = 0, dz = 0;
            if (keys.up) dz -= playerSpeed;
            if (keys.down) dz += playerSpeed;
            if (keys.left) dx -= playerSpeed;
            if (keys.right) dx += playerSpeed;

            if (dx !== 0 && !checkCollision(player.position.x + dx, player.position.z)) {
                player.position.x += dx;
            }
            if (dz !== 0 && !checkCollision(player.position.x, player.position.z + dz)) {
                player.position.z += dz;
            }

            let targetCamX = player.position.x;
            let targetCamZ = player.position.z + 15; 
            camera.position.x += (targetCamX - camera.position.x) * 0.1;
            camera.position.z += (targetCamZ - camera.position.z) * 0.1;
            camera.position.y = 20; 
            camera.lookAt(player.position);

            let distToGoal = Math.hypot(player.position.x - goalMarker.position.x, player.position.z - goalMarker.position.z);
            if (distToGoal < cellSize * 0.8) {
                gameActive = false;
                clearInterval(timerInterval);
                let timeSpent = Math.floor((Date.now() - startTime) / 1000);
                document.getElementById('victoryTime').innerText = `Stage ${currentStage} Cleared in ${timeSpent}s`;
                document.getElementById('victoryScreen').style.display = 'flex';
            }

            renderer.render(scene, camera);
        }

        // تحديث الحجم عند تغيير أبعاد الشاشة
        window.addEventListener('resize', () => {
            if (camera && renderer && gameActive) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
